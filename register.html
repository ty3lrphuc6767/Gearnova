<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đăng ký | GearNova</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="./auth.css?v=20"
    >

</head>


<body>


<main class="auth-page">


    <!-- ==================================================
         LEFT
    =================================================== -->

    <section class="intro">


        <a
            href="./index.html"
            class="logo"
        >
            Gear<span>Nova</span>
        </a>



        <div class="intro-content">


            <p class="small-title">
                JOIN GEARNOVA
            </p>


            <h1>

                TẠO TÀI KHOẢN

                <br>

                <span>
                    GEARNOVA
                </span>

            </h1>


            <p class="intro-text">

                Tạo tài khoản để lưu giỏ hàng,
                khám phá linh kiện máy tính
                và Gaming Gear.

            </p>



            <div class="feature-list">


                <div class="feature">

                    <i></i>

                    <span>
                        Tài khoản cá nhân
                    </span>

                </div>


                <div class="feature">

                    <i></i>

                    <span>
                        Lưu giỏ hàng
                    </span>

                </div>


                <div class="feature">

                    <i></i>

                    <span>
                        Đăng nhập Google
                    </span>

                </div>


            </div>


        </div>



        <p class="copyright">
            © 2026 GearNova
        </p>


    </section>



    <!-- ==================================================
         RIGHT
    =================================================== -->

    <section class="form-area">


        <div class="auth-box">


            <p class="form-tag">
                CREATE ACCOUNT
            </p>


            <h2>
                Đăng ký
            </h2>


            <p class="description">
                Tạo tài khoản GearNova mới.
            </p>



            <form id="registerForm">


                <!-- NAME -->

                <div class="input-group">


                    <label for="registerName">
                        Tên hiển thị
                    </label>


                    <input
                        type="text"
                        id="registerName"
                        placeholder="Ví dụ: Sinh Phúc"
                        autocomplete="name"
                        required
                    >


                </div>



                <!-- EMAIL -->

                <div class="input-group">


                    <label for="registerEmail">
                        Email
                    </label>


                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="example@gmail.com"
                        autocomplete="email"
                        required
                    >


                </div>



                <!-- PASSWORD -->

                <div class="input-group">


                    <label for="registerPassword">
                        Password
                    </label>


                    <div class="password-box">


                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Tối thiểu 6 ký tự"
                            autocomplete="new-password"
                            required
                        >


                        <button
                            type="button"
                            id="showPassword"
                        >
                            Hiện
                        </button>


                    </div>


                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="input-group">


                    <label for="confirmPassword">
                        Nhập lại Password
                    </label>


                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Nhập lại mật khẩu"
                        autocomplete="new-password"
                        required
                    >


                </div>



                <p
                    id="registerMessage"
                    class="message"
                ></p>



                <button
                    type="submit"
                    class="submit-btn"
                    id="registerBtn"
                >
                    TẠO TÀI KHOẢN
                </button>


            </form>



            <div class="oauth-divider">

                <span>
                    HOẶC
                </span>

            </div>



            <button
                type="button"
                class="google-btn"
                id="googleLoginBtn"
            >

                <span class="google-icon">
                    G
                </span>

                <span>
                    Tiếp tục bằng Google
                </span>

            </button>



            <p class="switch-page">

                Đã có tài khoản?

                <a href="./login.html">
                    Đăng nhập
                </a>

            </p>


        </div>


    </section>


</main>



<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- <script src="./supabase-client.js?v=20"></script> -->

<!-- <script src="./register.js?v=20"></script> -->
<script src="register.js"></script>


</body>

</html>
