<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111318" />
    <title>Đăng ký | GearNova</title>
    <link rel="stylesheet" href="./auth.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="./supabase-client.js" defer></script>
    <script src="./register.js" defer></script>
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-shell" aria-labelledby="registerTitle">
        <a class="brand" href="./login.html">Gear<span>Nova</span></a>
        <div class="auth-card">
          <p class="eyebrow">CREATE ACCOUNT</p>
          <h1 id="registerTitle">Tạo tài khoản</h1>
          <p>Đăng ký một lần để bắt đầu khám phá GearNova.</p>
          <form class="auth-form" id="registerForm" novalidate>
            <label>Tên hiển thị<input id="registerName" type="text" autocomplete="name" required maxlength="80" placeholder="Tên của bạn" /></label>
            <label>Email<input id="registerEmail" type="email" autocomplete="email" required placeholder="name@example.com" /></label>
            <label>Mật khẩu<div class="password-wrap"><input id="registerPassword" type="password" autocomplete="new-password" required minlength="6" placeholder="Ít nhất 6 ký tự" /><button class="toggle-password" id="togglePassword" type="button">Hiện</button></div></label>
            <label>Xác nhận mật khẩu<input id="confirmPassword" type="password" autocomplete="new-password" required minlength="6" placeholder="Nhập lại mật khẩu" /></label>
            <p class="form-message" id="registerMessage" aria-live="polite"></p>
            <button class="auth-button" id="registerBtn" type="submit">Tạo tài khoản</button>
          </form>
          <p class="auth-footer">Đã có tài khoản? <a href="./login.html">Đăng nhập</a></p>
          <a class="back-link" href="./login.html">← Quay lại đăng nhập</a>
        </div>
      </section>
    </main>
  </body>
</html>
