<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111318" />
    <title>Đăng nhập | GearNova</title>
    <link rel="stylesheet" href="./auth.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="./supabase-client.js" defer></script>
    <script src="./login.js" defer></script>
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-shell" aria-labelledby="loginTitle">
        <a class="brand" href="./login.html">Gear<span>Nova</span></a>
        <div class="auth-card">
          <p class="eyebrow">WELCOME BACK</p>
          <h1 id="loginTitle">Đăng nhập</h1>
          <p>Đăng nhập để xem sản phẩm, lưu giỏ hàng và quản lý tài khoản.</p>
          <form class="auth-form" id="loginForm" novalidate>
            <label>Email<input id="loginEmail" type="email" autocomplete="email" required placeholder="name@example.com" /></label>
            <label>Mật khẩu<div class="password-wrap"><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Nhập mật khẩu" /><button class="toggle-password" id="togglePassword" type="button">Hiện</button></div></label>
            <p class="form-message" id="loginMessage" aria-live="polite"></p>
            <button class="auth-button" id="loginBtn" type="submit">Đăng nhập</button>
          </form>
          <p class="auth-footer">Chưa có tài khoản? <a href="./register.html">Đăng ký ngay</a></p>
          <a class="back-link" href="./login.html">← GearNova</a>
        </div>
      </section>
    </main>
  </body>
</html>
